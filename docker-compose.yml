services:

  # ─── MongoDB instances (one per service) ───────────────────────────────────

  mongo-user:
    image: mongo:7
    container_name: mongo-user
    volumes:
      - mongo-user-data:/data/db
    networks:
      - healthcare-net

  mongo-clinical:
    image: mongo:7
    container_name: mongo-clinical
    volumes:
      - mongo-clinical-data:/data/db
    networks:
      - healthcare-net

  mongo-appointment:
    image: mongo:7
    container_name: mongo-appointment
    volumes:
      - mongo-appointment-data:/data/db
    networks:
      - healthcare-net

  mongo-transaction:
    image: mongo:7
    container_name: mongo-transaction
    volumes:
      - mongo-transaction-data:/data/db
    networks:
      - healthcare-net

  mongo-ai:
    image: mongo:7
    container_name: mongo-ai
    volumes:
      - mongo-ai-data:/data/db
    networks:
      - healthcare-net

  # ─── Redis (session cache for appointment-video-service) ──────────────────

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - healthcare-net

  # ─── Microservices ──────────────────────────────────────────────────────────

  user-identity-service:
    build: ./services/user-identity-service
    container_name: user-identity-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGO_URI: mongodb://mongo-user:27017/user-identity-db
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_prod}
      JWT_EXPIRES_IN: 7d
    depends_on:
      - mongo-user
    networks:
      - healthcare-net

  clinical-medical-service:
    build: ./services/clinical-medical-service
    container_name: clinical-medical-service
    environment:
      PORT: 3002
      MONGO_URI: mongodb://mongo-clinical:27017/clinical-medical-db
      UPLOAD_DIR: /app/uploads
    volumes:
      - clinical-uploads:/app/uploads
    depends_on:
      - mongo-clinical
    networks:
      - healthcare-net

  appointment-video-service:
    build: ./services/appointment-video-service
    container_name: appointment-video-service
    environment:
      PORT: 3003
      MONGO_URI: mongodb://mongo-appointment:27017/appointment-video-db
      AGORA_APP_ID: ${AGORA_APP_ID:-}
      AGORA_APP_CERTIFICATE: ${AGORA_APP_CERTIFICATE:-}
      AGORA_TOKEN_EXPIRY: ${AGORA_TOKEN_EXPIRY:-3600}
      TRANSACTION_NOTIFY_SERVICE_URL: http://transaction-notify-service:3004
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo-appointment
      - redis
    networks:
      - healthcare-net

  transaction-notify-service:
    build: ./services/transaction-notify-service
    container_name: transaction-notify-service
    environment:
      PORT: 3004
      MONGO_URI: mongodb://mongo-transaction:27017/transaction-notify-db
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_placeholder}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_placeholder}
      SMTP_HOST: ${SMTP_HOST:-smtp.mailtrap.io}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@healthcare.local}
      EMAIL_FROM: ${SMTP_FROM:-noreply@healthcare.local}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
    depends_on:
      - mongo-transaction
    networks:
      - healthcare-net

  ai-symptom-checker-service:
    build: ./services/ai-symptom-checker-service
    container_name: ai-symptom-checker-service
    environment:
      PORT: 3005
      MONGO_URI: mongodb://mongo-ai:27017/ai-symptom-db
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - mongo-ai
    networks:
      - healthcare-net

  api-gateway:
    build: ./services/api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-supersecretkey_change_in_prod}
      USER_IDENTITY_SERVICE_URL: http://user-identity-service:3001
      CLINICAL_MEDICAL_SERVICE_URL: http://clinical-medical-service:3002
      APPOINTMENT_VIDEO_SERVICE_URL: http://appointment-video-service:3003
      TRANSACTION_NOTIFY_SERVICE_URL: http://transaction-notify-service:3004
      AI_SYMPTOM_CHECKER_SERVICE_URL: http://ai-symptom-checker-service:3005
    depends_on:
      - user-identity-service
      - clinical-medical-service
      - appointment-video-service
      - transaction-notify-service
      - ai-symptom-checker-service
    networks:
      - healthcare-net

  # ─── Web Client (React Frontend) ───────────────────────────────────────────

  web-client:
    build:
      context: ./web-client
      args:
        VITE_API_URL: ""
        VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_placeholder}
    container_name: web-client
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - healthcare-net

volumes:
  mongo-user-data:
  mongo-clinical-data:
  mongo-appointment-data:
  mongo-transaction-data:
  redis-data:
  mongo-ai-data:
  clinical-uploads:

networks:
  healthcare-net:
    driver: bridge
