version: '3.8'

services:
  appointment-service:
    build:
      context: ./services/appointment-video-service
      dockerfile: Dockerfile
    container_name: medicate-appointment-service
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/medicate_appointments
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AGORA_APP_ID=e7f6e9aeecf14b2ba10e3f40be9f56e7
      - AGORA_APP_CERTIFICATE=fb90ec88697e43a489af7be085b3ea59
    depends_on:
      - mongodb
      - redis
    networks:
      - medicate-network

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: medicate-web-client
    ports:
      - "3000:80"
    depends_on:
      - appointment-service
    networks:
      - medicate-network

  mongodb:
    image: mongo:7-alpine
    container_name: medicate-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medicate-network

  redis:
    image: redis:7-alpine
    container_name: medicate-redis
    ports:
      - "6379:6379"
    networks:
      - medicate-network

networks:
  medicate-network:
    driver: bridge

volumes:
  mongodb_data:
