services:

  user-identity-service:
    build:
      context: ./services/user-identity-service
      dockerfile: Dockerfile
    container_name: medicate-user-identity
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/medicate_users
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medicate-network

  clinical-medical-service:
    build:
      context: ./services/clinical-medical-service
      dockerfile: Dockerfile
    container_name: medicate-clinical
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medicate_clinical
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medicate-network

  mongodb:
    image: mongo:7
    container_name: medicate-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    restart: unless-stopped
    networks:
      - medicate-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb-data:

networks:
  medicate-network:
    driver: bridge
