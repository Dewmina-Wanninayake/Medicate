version: '3.8'
services:

  user-identity-service:
    build:
      context: ./services/user-identity-service
      dockerfile: Dockerfile
    container_name: medicate-user-identity
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/medicate_users
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medicate-network

  appointment-service:
    build:
      context: ./services/appointment-video-service
      dockerfile: Dockerfile
    container_name: medicate-appointment-service
    ports:
      - "5004:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/medicate_appointments
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - AGORA_APP_ID=${AGORA_APP_ID}
      - AGORA_APP_CERTIFICATE=${AGORA_APP_CERTIFICATE}
      - JWT_SECRET=${JWT_SECRET}
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicate-network

  clinical-medical-service:
    build:
      context: ./services/clinical-medical-service
      dockerfile: Dockerfile
    container_name: medicate-clinical-medical-service
    ports:
      - "5001:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medicate_clinical
      - NODE_ENV=production
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medicate-network

  transaction-notify-service:
    build:
      context: ./services/transaction-notify-service
      dockerfile: Dockerfile
    container_name: medicate-transaction-notify-service
    ports:
      - "3004:3003"
    environment:
      - PORT=3003
      - MONGODB_URI=mongodb://mongodb:27017/medicate_transactions
      - NODE_ENV=development
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ISSUER=medicate-user-identity-service
      - JWT_AUDIENCE=medicate-platform
      # ── SMTP (SendGrid) ──
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # ── Twilio ──
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_FROM_NUMBER=${TWILIO_FROM_NUMBER}
      # ── CORS ──
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:5173
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - medicate-network

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
      args:
        - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
    container_name: medicate-web-client
    ports:
      - "3000:80"
    environment:
      - VITE_USER_SERVICE_URL=http://localhost:3001/api
      - VITE_APPOINTMENT_SERVICE_URL=http://localhost:5004/api
      - VITE_CLINICAL_SERVICE_URL=http://localhost:5001/api
      - VITE_TRANSACTION_SERVICE_URL=http://localhost:3004/api
      - VITE_STRIPE_PUBLISHABLE_KEY=${VITE_STRIPE_PUBLISHABLE_KEY}
    depends_on:
      - appointment-service
      - clinical-medical-service
      - transaction-notify-service
    networks:
      - medicate-network

  mongodb:
    image: mongo:7
    container_name: medicate-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medicate-network
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:alpine
    container_name: medicate-redis
    ports:
      - "6380:6379"
    networks:
      - medicate-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  medicate-network:
    driver: bridge

volumes:
  mongodb_data:
