version: '2.1'
services:

  user-identity-service:
    build:
      context: ./services/user-identity-service
      dockerfile: Dockerfile
    container_name: medicate-user-identity
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - PORT=3001
      - MONGO_URI=mongodb://mongodb:27017/medicate_users
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=15m
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=7d
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medicate-network

  clinical-medical-service:
    build:
      context: ./services/clinical-medical-service
      dockerfile: Dockerfile
    container_name: medicate-clinical
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/medicate_clinical
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - medicate-network

  appointment-service:
    build:
      context: ./services/appointment-video-service
      dockerfile: Dockerfile
    container_name: medicate-appointment-service
    ports:
      - "5004:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://mongodb:27017/medicate_appointments
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - AGORA_APP_ID=e7f6e9aeecf14b2ba10e3f40be9f56e7
      - AGORA_APP_CERTIFICATE=fb90ec88697e43a489af7be085b3ea59
    restart: on-failure
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - medicate-network

  web-client:
    build:
      context: ./web-client
      dockerfile: Dockerfile
    container_name: medicate-web-client
    ports:
      - "3000:80"
    environment:
      - REACT_APP_APPOINTMENT_SERVICE_URL=http://localhost:5004
    depends_on:
      - appointment-service
    networks:
      - medicate-network

  mongodb:
    image: mongo:7
    container_name: medicate-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - medicate-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:alpine
    container_name: medicate-redis
    ports:
      - "6380:6379"
    networks:
      - medicate-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  medicate-network:
    driver: bridge

volumes:
  mongodb_data: