apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-identity-service
  namespace: medicate
  labels:
    app: user-identity-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-identity-service
  template:
    metadata:
      labels:
        app: user-identity-service
    spec:
      containers:
      - name: user-identity-service
        image: medicate-user-identity-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: user-identity-service-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: user-identity-service
  namespace: medicate
spec:
  selector:
    app: user-identity-service
  ports:
  - protocol: TCP
    port: 3001
    targetPort: 3001
  type: ClusterIP
