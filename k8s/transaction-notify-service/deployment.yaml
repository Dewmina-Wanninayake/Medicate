apiVersion: apps/v1
kind: Deployment
metadata:
  name: transaction-notify-service
  namespace: medicate
  labels:
    app: transaction-notify-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: transaction-notify-service
  template:
    metadata:
      labels:
        app: transaction-notify-service
    spec:
      containers:
        - name: transaction-notify-service
          image: medicate-transaction-notify:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3003
          envFrom:
          - secretRef:
              name: transaction-notify-service-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: transaction-notify-service
  namespace: medicate
spec:
  selector:
    app: transaction-notify-service
  ports:
    - protocol: TCP
      port: 3003
      targetPort: 3003
  type: ClusterIP