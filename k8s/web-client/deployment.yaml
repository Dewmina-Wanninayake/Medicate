apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-client
  namespace: medicate
  labels:
    app: web-client
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-client
  template:
    metadata:
      labels:
        app: web-client
    spec:
      containers:
      - name: web-client
        image: medicate-web-client:latest # Replace with your registry image
        ports:
        - containerPort: 80
        envFrom:
        - secretRef:
            name: web-client-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: web-client
  namespace: medicate
spec:
  selector:
    app: web-client
  ports:
  - protocol: TCP
    port: 80
    targetPort: 80
  type: LoadBalancer
